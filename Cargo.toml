[workspace]
members = [
  "framework",
  "chapters/tutorial1-window",
  "chapters/tutorial2-triangle",
  "chapters/tutorial3-buffers",
  "chapters/tutorial4-Textures",
  "chapters/tutorial5-uniforms",
  "chapters/tutorial6-instance",
  "chapters/tutorial7-particles",
  "chapters/tutorial8-model", "chapters/tutorial9-light", "chapters/donuts-vertex", "chapters/tutorial10-normals",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"
glam = { version = "0.34.1", features = ["bytemuck", "std"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
framework = { path = "framework" }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
] }
rand = "0.10.3"
fs_extra = "1.3.0"
glob = "0.3.4"
gltf = { version = "1.4", features = ["import"] }

[profile.release]
strip = true
